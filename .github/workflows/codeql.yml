name: "CodeQL"

on:
  push:
    branches: [ main, develop ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  # No `paths` filter on pull_request: the Analyze jobs are required status checks in
  # the branch rulesets, so they must report on every pull request (see tests.yml).
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Set up Python (for Python analysis)
        if: matrix.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies (for Python analysis)
        if: matrix.language == 'python'
        run: pip install -r backend/requirements.txt

      - name: Set up Node.js (for JavaScript analysis)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies (for JavaScript analysis)
        if: matrix.language == 'javascript-typescript'
        run: cd frontend && npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{matrix.language}}"
